<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <th:block th:fragment="meta">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fredoka:wght@400;500;600;700&family=VT323&display=swap"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/echo.css}">
    </th:block>
</head>
<body>

<header th:fragment="topbar" class="viewfinder">
    <div class="vf-strip">
        <span class="rec"><span class="rec-dot"></span>REC</span>
        <span class="osd-time" id="osdTime">00:00:00</span>
        <span class="osd-tape">▶ ECHO CAM · SP</span>
        <span class="osd-bat">▮▮▮▯</span>
    </div>
    <div class="topbar">
        <a class="brand" th:href="@{/catalog}">
            <span class="brand-mark">echo</span>
            <span class="brand-note">♪</span>
            <span class="brand-doodle">press play</span>
        </a>
        <nav class="nav">
            <a class="chip-link" th:href="@{/catalog}" th:text="#{nav.catalog}">Catalog</a>
            <a class="chip-link" sec:authorize="hasRole('USER')" th:href="@{/ratings}"
               th:text="#{nav.myRatings}">My ratings</a>
            <a class="chip-link chip-studio" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}"
               th:text="#{nav.studio}">Studio</a>
        </nav>
        <div class="topbar-right">
            <div class="lang">
                <a th:unless="${#locale.language == 'en'}" th:href="@{${currentUri}(lang='en')}"
                   th:text="#{lang.en}">EN</a>
                <span th:if="${#locale.language == 'en'}" aria-current="true"
                      style="background:#27416b;color:#fff;padding:1px 8px;border-radius:6px;"
                      th:text="#{lang.en}">EN</span>
                <span>·</span>
                <a th:unless="${#locale.language == 'pt'}" th:href="@{${currentUri}(lang='pt')}"
                   th:text="#{lang.pt}">PT</a>
                <span th:if="${#locale.language == 'pt'}" aria-current="true"
                      style="background:#27416b;color:#fff;padding:1px 8px;border-radius:6px;"
                      th:text="#{lang.pt}">PT</span>
                <span>·</span>
                <a th:unless="${#locale.language == 'fr'}" th:href="@{${currentUri}(lang='fr')}"
                   th:text="#{lang.fr}">FR</a>
                <span th:if="${#locale.language == 'fr'}" aria-current="true"
                      style="background:#27416b;color:#fff;padding:1px 8px;border-radius:6px;"
                      th:text="#{lang.fr}">FR</span>
            </div>
            <div class="auth" sec:authorize="isAnonymous()">
                <a class="chip-link" th:href="@{/login}" th:text="#{nav.login}">Log in</a>
                <a class="btn btn-pink btn-sm" th:href="@{/signup}" th:text="#{nav.signup}">Sign up</a>
            </div>
            <div class="auth" sec:authorize="isAuthenticated()">
                <span class="hello">
                    <span class="hello-hi" th:text="#{nav.hi}">hi,</span>
                    <span class="hello-name" sec:authentication="name">user</span>
                </span>
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button class="btn btn-ghost btn-sm" type="submit" th:text="#{nav.logout}">Log out</button>
                </form>
            </div>
        </div>
    </div>
</header>

<div th:fragment="messages" class="messages">
    <div class="alert alert-ok" th:if="${flashSuccess}">
        <span class="alert-tape"></span>
        <span th:text="#{${flashSuccess}}">Saved.</span>
    </div>
    <div class="alert alert-err" th:if="${flashError}">
        <span class="alert-tape"></span>
        <span th:text="#{${flashError}}">Something went wrong.</span>
    </div>
</div>

<footer th:fragment="footer" class="footer">
    <span class="footer-doodle">made with denim &amp; daydreams</span>
    <span class="footer-meta">echo · <span th:text="#{footer.tagline}">your music scrapbook</span></span>
    <span class="footer-stamp" id="osdStamp">·</span>
    <script th:fragment="clock-script">
        (function () {
            function pad(n) { return n < 10 ? '0' + n : '' + n; }
            function tick() {
                var now = new Date();
                var t = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
                var d = pad(now.getDate()) + '.' + pad(now.getMonth() + 1) + '.' + now.getFullYear();
                var time = document.getElementById('osdTime');
                var stamp = document.getElementById('osdStamp');
                if (time) { time.textContent = t; }
                if (stamp) { stamp.textContent = d + '  ' + t; }
            }
            tick();
            setInterval(tick, 1000);

            document.addEventListener('submit', function (e) {
                var msg = e.target.getAttribute && e.target.getAttribute('data-confirm');
                if (msg && !window.confirm(msg)) {
                    e.preventDefault();
                }
            }, true);
        })();
    </script>
</footer>

</body>
</html>
